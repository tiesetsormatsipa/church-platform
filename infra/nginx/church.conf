# Nginx server block for the Church Platform.
#
# Install on the host as /etc/nginx/sites-available/church, symlink it into sites-enabled,
# then `nginx -t && systemctl reload nginx`. Substitute SERVER_NAME, WEB_PORT and API_PORT
# to match .env.production (see docs/DEPLOYMENT.md).
#
# The application containers listen on the loopback interface only; this is the only way in.

upstream church_web {
    server 127.0.0.1:3500;
    keepalive 16;
}

upstream church_api {
    server 127.0.0.1:4400;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name church.techtursolutions.com;

    # Certbot renewals are served over plain HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name church.techtursolutions.com;

    ssl_certificate /etc/letsencrypt/live/church.techtursolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/church.techtursolutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Sermon audio and video; the API also enforces a signed size limit on uploads.
    client_max_body_size 512m;

    # HSTS. Remove if this host must ever be reachable over plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/church.access.log;
    error_log  /var/log/nginx/church.error.log;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # The web app's cache-revalidation webhook. The worker reaches it over the Docker
    # network, so nothing outside the host has any business calling it.
    location /internal/ {
        return 404;
    }

    # The API is reached directly rather than through the web app's rewrite, so that rate
    # limiting sees the visitor's address (ADR-024) and the hop is saved.
    location /api/ {
        proxy_pass http://church_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }

    location /socket.io/ {
        proxy_pass http://church_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Public media objects from the S3-compatible store (Phase 8).
    location /media/ {
        proxy_pass http://127.0.0.1:9100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # Immutable build assets.
    location /_next/static/ {
        proxy_pass http://church_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://church_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;
    }
}
